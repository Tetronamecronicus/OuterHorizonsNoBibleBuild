- type: entity
  id: TestStationShuttles
  abstract: true
  components:
    - type: StationCargoShuttle
      path: /Maps/Shuttles/cargo.yml
    - type: GridSpawn
      groups:
        # Spawn last
        ruins: !type:GridSpawnGroup
          hide: true
          nameGrid: true
          minimumDistance: 150
          maximumDistance: 900
          minCount: 90
          maxCount: 100
          stationGrid: false
          addComponents:
          - type: OrbitalBody
          - type: IFF
            flags: HideLabel
            color: "#88b0d1"
          paths:
          - /Maps/Shuttles/cargo.yml

- type: entity
  parent: BaseComputerShuttle
  id: DebugComputerShuttle
  name: _тести
  description: Used to pilot a shuttle.
  components:
  - type: RadarConsole
    maxRange: 768

- type: entity
  id: ThrusterMain
  parent: ThrusterLarge
  name: _main engine
  description: A powerful engine for orbital corrections. Works only while main engines are enabled in the shuttle console.
  components:
  - type: Thruster
    thrusterType: Main
    thrust: 10240
    damage:
      types:
        Heat: 240

- type: entity
  id: DebugThrusterMain
  parent: DebugThruster
  name: _main engine
  suffix: DEBUG
  components:
  - type: Thruster
    thrusterType: Main
    thrust: 10240
