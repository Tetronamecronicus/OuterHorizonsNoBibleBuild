- type: entity
  id: TestStationShuttles
  abstract: true
  components:
    - type: StationCargoShuttle
      path: /Maps/Shuttles/cargo.yml
    - type: GridSpawn
      groups:
        trade: !type:GridSpawnGroup
          addComponents:
            - type: ProtectedGrid
            - type: TradeStation
          paths:
            - /Maps/Shuttles/trading_outpost.yml
        # Spawn last
        ruins: !type:GridSpawnGroup
          hide: true
          nameGrid: true
          minimumDistance: 150
          maximumDistance: 900
          minCount: 90
          maxCount: 100
          stationGrid: false
          addComponents:
          - type: OrbitalBody
          - type: IFF
            flags: HideLabel
            color: "#88b0d1"
          paths:
          - /Maps/Shuttles/cargo.yml

- type: entity
  parent: BaseComputerShuttle
  id: DebugComputerShuttle
  name: _тести
  description: Used to pilot a shuttle.
  components:
  - type: RadarConsole
    maxRange: 768
