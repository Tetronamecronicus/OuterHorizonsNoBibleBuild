
- type: particle  # прототип частицы
  id: baseParticle
  sprite:
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
  damping: 0
  zindex: 0 # чем выше число, тем позднее будет орисован партикл, следовательно он будет визуально выше того, что было нарисовано до него
  angulardamping: 0
  animated: true  # при false будет устанавливать текстуру случайного кадра анимации
  rtv: false   # будет ли партикл повёрнут в направлении движения (спрайт должен быть повёрнут вправо)
  lifetime: 1
  rlifetime: 0
  scale: 1
  rscale: 0
  rbrightness: 0 # слушайным орбазом уменьшает яркость партикла в диапазоне.  типа при rbrightness = 0.5, то яркость партикла может быть от 1, до 1 - 0.5
  nvelocity: 0
  navelocity: 0
  vispossnap: 0 # округление визуального положения
  visrotsnap: 0 # округление визуального вращения в градусах
  noiceSpeed: 1 # скорость изменения шума
  fade:  # градиет изменения прозрачности партикла
  - 0, 1    # это точки градиента.  дабавлять через  "- x, y"  значение X - положение точки в градиенте от 0 до 1,  Y - значение точки в градиенте (без пределов)
  scalegrad:  # градиент изменения размеров партикла
  - 0, 1



# все параметры с "r" в начале - случайное изменение параметра.    при dir = 0   rdir = 5,  то dir может быть случайным числом от -2.5 до 2.5
# всу параметры с "n" в начале - смягчённое случайное изменение параметра.   максимальное и минимальное значение как у "r", но там плавный переход в течении времени

- type: particlespawn  # прототип для спавна частицы
  id: baseParticleSpawn
  amount: 1
  ramount: 0
  position: 0, 0  # положение относительно спавнера
  rposition: 0, 0
  dirpos: 0 # положение в направлении dir
  velocity: 0, 0 # векторное движение партикла
  rvelocity: 0, 0
  rotation: 0
  rrotation: 0
  local: false # будут ли скорости, позиции, вращения задаваться с учётом вращения камеры
  avelocity: 0 # скорость вращения  (avelocity   a-velocity   angular velocity)
  ravelocity: 0
  stype: 0 # тип спавна    0 - линейно по направлению    1 - во все стороны    2 - по конусу
  onlyspeed: false # учитывается только speed, а velocity не учитывается
  speed: 0 # скорось в направлении dir, при onlyspeed = false - скорость добавляется к velocity
  rspeed: 0
  dir: 0 # направление в градусах
  rdir: 0
  conespread: 45 # угол конуса?  чтобы сделать случайный разброс используй rdir






